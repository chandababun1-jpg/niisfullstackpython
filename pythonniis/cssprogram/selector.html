<html>
<head>
<style>

/* Universal Selector */
* {
  margin: 0;
}

/* Element Selector */
p {
  color: red;
}

/* ID Selector */
#title {
  color: blue;
}

/* Class Selector */
.box {
  background-color: yellow;
}

/* Group Selector */
h1, p {
  font-family: Arial;
}

</style>
</head>
<body>

<h1 id="title">Heading</h1>

<p class="box">This is a paragraph</p>

</body>
</html>
